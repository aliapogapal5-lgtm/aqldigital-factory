
name: Modern Technology Daily Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: modern-technology-factory
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: python main.py

      - name: Create video
        run: python video_maker.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: modern-technology-video-${{ github.run_number }}
          path: modern_technology.mp4
          if-no-files-found: error
          retention-days: 7
